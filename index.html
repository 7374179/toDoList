<script>
    // const checkBox = $('input[type="checkbox"]');
    let allData ='';

    $(document).ready(function() {
        getLists();
    })


    $(document).on('change', 'input[type="checkbox"]', async function(){
        const content = $(this).closest('tr').find('.content');
        let is_comleted = '0'
        // TODO: 이거 어떻게 하는거였더라
        const id = content.data('id');
        if ($(this).is(':checked')) {
            content.addClass('text-decoration-line-through');
            is_completed = '1';
        } else {
            content.removeClass('text-decoration-line-through');
            is_completed = '0';
        }

        try {
            const response = await fetch(`http://localhost:3000/api/isCompleted/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    is_completed: is_completed
                })
            })
            alert('저장되었습니다');
        } catch (error) {
            alert('저장에 실패했습니다');
        }
    })

    $('.saveBtn').on('click', async function() {
        const list = $('#savedList');
        const test = $('#content').val();

        try {
            const response = await fetch('http://localhost:3000/api/addList', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: test
                }),
            });
            if (!response.ok) throw new Error('서버 응답 오류');
            alert('성공적으로 저장되었습니다!');
            getLists();
        } catch (error) {
            alert('저장에 실패했습니다.');
        }

        console.log('test: ', test);
        $('#content').val('');
    })

    $(document).on('click', 'button .bi-trash', async function() {
        console.log('haha');
        if (!confirm('삭제하시겠습니까?')) return;

        const id = $(this).closest('tr').find('.content').data('id');
        console.log('id: ', id);

        try {
            const response = await fetch(`/api/delete/${id}`, { method: 'DELETE' });
            if (!response.ok) throw new Error('서버 응답 오류');
            alert('성공적으로 삭제되었습니다');
            getLists();
        } catch (error) {
            alert('삭제에 실패했습니다.');
        }
    })
    
    async function getLists() {
        const response = await fetch('http://localhost:3000/api/getLists');
        const rawReports = await response.json();
        allData = rawReports;
        // const allReports = rawReports.map(r => ({
        //     ...r
        // }));
        console.log('rawReports: ', rawReports);
        const list = $('#savedList');
        list.empty();
        let body = '';

        rawReports.forEach((item) => {
            const checked = item.is_completed == '1' ? 'checked' : '';
            const is_completed = item.is_completed == '1' ? 'text-decoration-line-through' : '';
            body = `
                <tr>
                    <td>
                        <input type="checkbox" class="form-check-input" ${checked}>
                    </td>
                    <td>
                        <span class="content ${is_completed}" data-id="${item.list_id}">${item.content}</span>
                    </td>
                    <td class="text-center">
                        <span>${item.created_at.split('T')[0].slice(2).replace(/-/g, '')}</span>
                    </td>
                    <td>
                        <button class="btn btn-sm"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `;

            list.append(body);
        })            
    }
